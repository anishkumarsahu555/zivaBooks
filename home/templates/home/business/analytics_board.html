{% extends 'home/admin/index.html' %}
{% block title %}<title>{{ page_title }}</title>{% endblock %}
{% block css %}<style>.shell{padding:1rem}.panel{background:#fff;border:1px solid #dce7f3;border-radius:18px;box-shadow:0 14px 32px rgba(15,23,42,.06);padding:1rem;margin-bottom:1rem}.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.card{border:1px solid #e2ebf3;border-radius:16px;padding:14px;background:linear-gradient(180deg,#fbfdff,#f5f9fc)}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #e2ebf3;padding:10px 8px;text-align:left}.table th{color:#64748b;font-size:.76rem;text-transform:uppercase}@media (max-width:768px){.shell{padding:.2rem}.panel{padding:.7rem;border-radius:14px;margin-bottom:.55rem}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:10px;border-radius:14px}.ui.stackable.grid>.column{padding-left:.2rem!important;padding-right:.2rem!important}.table{display:block;overflow-x:auto;white-space:nowrap}.field{margin-bottom:.42rem!important}}@media (max-width:768px){.panel .ui.form>.fields:first-child{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem;align-items:end}.panel .ui.form>.fields:first-child>.field{width:auto!important;margin:0!important}.panel .ui.form>.fields:first-child>.field:last-child{grid-column:1/-1}.panel .ui.form>.fields:first-child .ui.button{width:100%}}</style>{% endblock %}
{% block body %}<div class="shell"><div class="ui pointing secondary menu"><div class="item active">{{ page_title }}</div></div><div class="panel"><div class="ui tiny form"><div class="fields"><div class="four wide field"><label>Start Date</label><div class="ui calendar" id="rangestart"><div class="ui input"><input type="text" id="startDate" value="{{ defaultStartDate }}" placeholder="Start Date"></div></div></div><div class="four wide field"><label>End Date</label><div class="ui calendar" id="rangeend"><div class="ui input"><input type="text" id="endDate" value="{{ defaultEndDate }}" placeholder="End Date"></div></div></div><div class="four wide field"><label>&nbsp;</label><button class="ui teal button" type="button" onclick="loadBoard()">Load</button></div></div></div></div><div class="panel"><div class="cards" id="summaryCards"></div></div><div class="ui two column stackable grid"><div class="column"><div class="panel"><h4 class="ui header">{{ primary_title }}</h4><table class="table" id="primaryTable"></table></div></div><div class="column"><div class="panel"><h4 class="ui header">{{ secondary_title }}</h4><table class="table" id="secondaryTable"></table></div></div></div></div>{% endblock %}
{% block js %}<script>function rowsTable(id,rows){const t=$('#'+id).empty();t.append('<thead><tr><th>Name</th><th>Value</th><th>Count</th></tr></thead>');const b=$('<tbody></tbody>');(rows||[]).forEach(r=>b.append('<tr><td>'+r.label+'</td><td>'+r.amount+'</td><td>'+r.count+'</td></tr>'));if(!rows||!rows.length)b.append('<tr><td colspan="3">No data found.</td></tr>');t.append(b);}function loadBoard(){$.getJSON('{{ api_url }}',{startDate:$('#startDate').val(),endDate:$('#endDate').val()}).done(function(r){const c=$('#summaryCards').empty();(r.data.summary||[]).forEach(i=>c.append('<div class="card"><small>'+i.label+'</small><div><strong>'+i.value+'</strong></div></div>'));rowsTable('primaryTable',r.data.primary_rows);rowsTable('secondaryTable',r.data.secondary_rows);});}var today=new Date();$('#rangestart').calendar({type:'date',endCalendar:$('#rangeend'),monthFirst:false,formatter:{date:function(date){if(!date)return '';return date.getDate()+'/'+(date.getMonth()+1)+'/'+date.getFullYear();}}});$('#rangeend').calendar({type:'date',startCalendar:$('#rangestart'),monthFirst:false,formatter:{date:function(date){if(!date)return '';return date.getDate()+'/'+(date.getMonth()+1)+'/'+date.getFullYear();}}});loadBoard();</script>{% endblock %}
