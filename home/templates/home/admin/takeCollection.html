{% extends 'home/admin/index.html' %}
{% load static %}
{% block title %}
    <title>Take Collection</title>
{% endblock %}
{% block css %}
    <style>
        .avatar-upload {
            position: relative;
            max-width: 115px;
            margin: 5px auto;
        }

        .avatar-upload .avatar-edit {
            position: absolute;
            right: 12px;
            z-index: 1;
            top: 10px;
        }

        .avatar-upload .avatar-edit input {
            display: none;
        }

        .avatar-upload .avatar-edit input + label {
            display: inline-block;
            width: 25px;
            height: 25px;
            margin-bottom: 0;
            border-radius: 100%;
            background: #FFFFFF;
            border: 1px solid transparent;
            box-shadow: 0px 2px 4px 0px rgba(0, 0, 0, 0.12);
            cursor: pointer;
            font-weight: normal;
            transition: all 0.2s ease-in-out;
        }

        .avatar-upload .avatar-edit input + label:hover {
            background: #f1f1f1;
            border-color: #d6d6d6;
        }

        .avatar-upload .avatar-edit input + label:after {
            color: #757575;
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            text-align: center;
            margin: auto;

        }

        .avatar-upload .avatar-preview {
            width: 100px;
            height: 100px;
            position: relative;
            border-radius: 100%;
            border: 6px solid #F8F8F8;
            box-shadow: 0px 2px 4px 0px rgba(0, 0, 0, 0.1);
        }

        .avatar-upload .avatar-preview > div {
            width: 100%;
            height: 100%;
            border-radius: 100%;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

    </style>
{% endblock %}
{% block body %}

    <div class="ui aligned basic  grid">
        <div class="sixteen wide column">
            <div class="ui  pointing secondary menu">
                <div style="cursor: pointer;" class="item active" data-tab="user"
                >Take New Collection
                </div>
            </div>
            <div class="ui tab " data-tab="user">

                <div class="ui row teal stacked segment padded">
                    <div class="content">

                        <form class="ui  small form " id="addForm">{% csrf_token %}
                            <div class="one fields">
                                <div class="sixteen wide field required">
                                    <label>Party Name</label>
                                    <select class="ui clearable search dropdown" id="party">
                                        <option value="">Search By Party Name</option>
                                    </select>
                                </div>

                            </div>
                            <div class="two required fields ">
                                <div class=" field required">
                                    <label>Mode Of Payment</label>
                                    <select class="ui dropdown search fluid " id="paymentMode" onchange="isCash()">
                                        <option value="">Select Mode Of Payment</option>
                                        <option value="Cash">Cash</option>
                                        <option value="Cheque CC">Cheque CC</option>
                                        <option value="Cheque">Cheque</option>
                                        <option value="Online">Online</option>
                                        <option value="Party">Party</option>
                                    </select>
                                </div>

                                <div class="eight wide field required">
                                    <label>Amount Paid (₹ <a class="ui violet label" id="money">0.0</a> )</label>
                                    <input type="number" name="amountPaid" id="amountPaid" placeholder="Amount Paid"
                                           onkeyup="toIndianCurrency()">


                                </div>


                            </div>
                         <div class="one fields" id="partyDiv" style="display: None">
                                <div class="sixteen wide field required">
                                    <label>Transferred Party Name</label>
                                    <select class="ui clearable search dropdown" id="TransferredParty">
                                        <option value="">Search By Party Name</option>
                                    </select>
                                </div>

                            </div>
                            <div class="two required fields ">
                                <div class=" field required" id="bankDiv" style="display: none">
                                    <label>Bank </label>
                                    <select class="ui dropdown search fluid " id="bank">
                                        <option value="">Select Bank</option>
                                        {% for foo in instance %}
                                            <option value="{{ foo.id }}">{{ foo.name }}
                                                - {{ foo.accountNumber }} </option>
                                        {% endfor %}


                                    </select>
                                </div>


                                <div class="eight wide field required" id="detailDiv" style="display: none">
                                    <label>Detail</label>
                                    <input type="text" name="detail" id="detail" placeholder="Detail">

                                </div>
                                <div class="eight wide field required" id="chequeDatelDiv" style="display: none">
                                    <label>Cheque Date</label>
                                    <div class="ui calendar" id="cheqDate">
                                        <input type="text" name="chequeDate" id="chequeDate" placeholder="chequeDate">
                                    </div>
                                </div>


                            </div>
                            <div class="one fields">
                                <div class="sixteen wide field required">
                                    <label>Collection Date</label>
                                    <div class="ui calendar" id="collectionDate">
                                        <div class="ui input">
                                            <input type="text" placeholder="Date" id="collectDate" name="collectDate">
                                        </div>
                                    </div>
                                </div>

                            </div>
                            <div class="one  fields ">

                                <div class="sixteen wide  field ">
                                    <label>Remark</label>
                                    <textarea name="" id="remark" placeholder="Any Remark" rows="3"></textarea>
                                </div>


                            </div>

                            <div class="one fields">
                                <div class="sixteen wide field">
                                    <div class="ui checkbox" style="margin-top: 4px;">
                                        <input type="checkbox" id="otpRequired" onchange="toggleOtp()">
                                        <label>OTP confirmation (optional)</label>
                                    </div>
                                    <div id="otpBox" style="display:none; margin-top: 10px;">
                                        <div class="ui mini message" id="otpStatus" style="display:none;"></div>
                                        <div class="ui equal width stackable grid" style="margin: 0;">
                                            <div class="row" style="padding: 0;">
                                                <div class="column" style="padding: 0 6px 0 0;">
                                                    <button type="button" class="ui tiny button" id="sendOtpBtn" onclick="sendOtp()">
                                                        <i class="key icon"></i> Generate OTP
                                                    </button>
                                                </div>
                                                <div class="column" style="padding: 0 6px;">
                                                    <div class="ui tiny input" style="width: 100%;">
                                                        <input type="text" id="otpCode" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" placeholder="Enter OTP" onkeyup="autoVerifyOtp()">
                                                    </div>
                                                </div>
                                                <div class="column" style="padding: 0 0 0 6px;">
                                                    <button type="button" class="ui tiny teal button" id="verifyOtpBtn" onclick="verifyOtp()">
                                                        <i class="check icon"></i> Verify
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                        <div style="margin-top: 8px;">
                                            <button type="button" class="ui tiny basic button" id="editOtpBtn" style="display:none;" onclick="editOtpDetails()">
                                                <i class="edit icon"></i> Edit details
                                            </button>
                                        </div>
                                        <div class="ui tiny label green" id="otpVerifiedBadge" style="display:none; margin-top: 8px;">
                                            <i class="check circle icon"></i> Verified
                                        </div>
                                        <input type="hidden" id="otpVerified" value="0">
                                        <input type="hidden" id="otpRequested" value="0">
                                    </div>
                                </div>
                            </div>

                            <div class="ui label teal" data-variation="mini" data-inverted="" data-tooltip="Location"
                                 data-position="bottom center">
                                <i class="map marked alternate icon"></i>

                                <a class="detail"><span id="htmlLat">0.0</span>,<span id="htmlLong">0.0</span> </a>
                            </div>

                        </form>
                    </div>
                    <div class="ui  aligned basic  grid">
                        <div class="row" style="padding-left: 5px;padding-right: 5px">
                            <div class="16 wide column center aligned">
                                <button onclick="salesSave()" id="saveBtn" class="ui green  button saveBtn">
                                    Submit Detail
                                </button>
                                <button style="display: none;" class="ui teal double loading button saveBtnLoad">
                                    Saving ....
                                </button>
                            </div>
                        </div>
                    </div>


                </div>


            </div>
        </div>


    </div>

    <input type="hidden" id="lat" value="24.809611">
    <input type="hidden" id="lng" value="93.935577">
    <input type="hidden" id="loc" value="N/A">

    <p id="demo"></p>


{% endblock %}

{% block js %}
    <script type="text/javascript">
        $('.ui.dropdown').dropdown({fullTextSearch: true});
    </script>

    <script>
        var today = new Date();
        $('#cheqDate')
            .calendar({
                    initialDate: today.getDate() + '/' + (today.getMonth() + 1) + '/' + today.getFullYear(),
                    monthFirst: false,
                    type: 'date',
                    formatter: {
                        date: function (date, settings) {

                            if (!date) return '';
                            var day = String(date.getDate());
                            var month = String(date.getMonth() + 1);
                            var year = date.getFullYear();
                            {#                            return '{{ sale.invoiceDate|date:'d/m/Y' }}';#}
                            return day + '/' + month + '/' + year;
                        }
                    }
                }
            );
        $('#collectionDate')
            .calendar({
                    initialDate: today.getDate() + '/' + (today.getMonth() + 1) + '/' + today.getFullYear(),
                    monthFirst: false,
                    type: 'date',
                    formatter: {
                        date: function (date, settings) {

                            if (!date) return '';
                            var day = String(date.getDate());
                            var month = String(date.getMonth() + 1);
                            var year = date.getFullYear();
                            return day + '/' + month + '/' + year;
                        }
                    }
                }
            );
        function isCash() {
            var mode = $('#paymentMode').val();
            var needsBank = (mode === 'Online' || mode === 'Cheque' || mode === 'Cheque CC');
            var needsChequeDate = (mode === 'Cheque' || mode === 'Cheque CC');
            var isParty = (mode === 'Party');

            $('#bankDiv').css('display', needsBank ? "" : "none");
            $('#detailDiv').css('display', needsBank ? "" : "none");
            $('#chequeDatelDiv').css('display', needsChequeDate ? "" : "none");
            $('#partyDiv').css('display', isParty ? "" : "none");

            if (!needsBank) {
                try { $('#bank').dropdown('clear'); } catch (err) { $('#bank').val(''); }
            }
            if (!needsChequeDate) {
                $('#chequeDate').val('');
            }
        }

        function salesSave() {
            showLoading();
            var party = $('#party').val();
            var paymentMode = $('#paymentMode').val();
            var amountPaid = $('#amountPaid').val();
            var bank = $('#bank').val();
            var detail = $('#detail').val();
            var remark = $('#remark').val();
            var otpRequired = $('#otpRequired').is(':checked');
            var otpCode = $('#otpCode').val();
            var otpVerified = $('#otpVerified').val();
            var lat = $('#lat').val();
            var lng = $('#lng').val();
            var chequeDate = $('#chequeDate').val();
            var collectDate = $('#collectDate').val();
            var TransferredParty = $('#TransferredParty').val();

            if (party === '' || paymentMode === '' || amountPaid === ''|| collectDate === '') {
                $('body')
                    .toast({
                        class: 'orange',
                        message: '* fields are required !'
                    })
                ;
                hideLoading();
                return;
            }

            if ((paymentMode === 'Online' || paymentMode === 'Cheque' || paymentMode === 'Cheque CC') && bank === '') {
                $('body')
                    .toast({
                        class: 'orange',
                        message: 'Please select a bank for Online/Cheque payments.'
                    })
                ;
                hideLoading();
                return;
            }

            if ((paymentMode === 'Cheque' || paymentMode === 'Cheque CC') && chequeDate === '') {
                $('body')
                    .toast({
                        class: 'orange',
                        message: 'Cheque date is required for cheque payments.'
                    })
                ;
                hideLoading();
                return;
            }

            if (otpRequired && otpVerified !== '1') {
                $('body').toast({ class: 'orange', message: 'Please verify OTP before submitting.' });
                hideLoading();
                return;
            } else {
                data = new FormData();
                data.append('party', party);
                data.append('paymentMode', paymentMode);
                data.append('amountPaid', amountPaid);
                data.append('bank', bank);
                data.append('detail', detail);
                data.append('lat', lat);
                data.append('lng', lng);
                data.append('remark', remark);
                data.append('otpRequired', otpRequired ? '1' : '0');
                data.append('otpCode', otpCode);
                data.append('chequeDate', chequeDate);
                data.append('collectDate', collectDate);
                data.append('TransferredParty', TransferredParty);

                $.ajax({
                    type: 'post',
                    url: '{% url 'homeApp:add_collection_by_admin_api' %}',
                    data: data,
                    contentType: false,
                    cache: false,
                    processData: false,


                    success: function (response) {
                    if (response.message === 'success') {
                        $('body')
                            .toast({
                                class: 'success',
                                message: 'New Collection added Successfully.'
                            });

                        hideLoading();
                        try { $('#otpRequired').prop('checked', false); toggleOtp(); } catch (e) {}

                        location.href = "{% url 'homeApp:collection_list' %}"

                        } else if (response.message === 'bank_required') {
                            $('body')
                                .toast({
                                    class: 'orange',
                                    message: 'Please select a bank for Online/Cheque payments.'
                                })
                            ;
                            hideLoading();
                        } else if (response.message === 'cheque_date_required') {
                            $('body')
                                .toast({
                                    class: 'orange',
                                    message: 'Cheque date is required for cheque payments.'
                                })
                            ;
                            hideLoading();
                        } else if (response.message === 'otp_required') {
                            $('body').toast({ class: 'orange', message: 'OTP is required. Please enter OTP.' });
                            hideLoading();
                        } else if (response.message === 'otp_invalid') {
                            $('body').toast({ class: 'orange', message: 'Invalid OTP. Please verify OTP again.' });
                            hideLoading();
                        } else if (response.message === 'otp_mismatch') {
                            $('body').toast({ class: 'orange', message: 'OTP details mismatch (mode/amount/date). Generate OTP again.' });
                            hideLoading();
                        } else {
                            $('body')
                                .toast({
                                    class: 'error',
                                    message: 'An error occurred !'
                                })
                            ;
                            hideLoading();
                        }

                        return response;
                    },
                    error: function () {
                        $('body')
                            .toast({
                                class: 'error',
                                message: 'An error occurred !'
                            })
                        ;
                        hideLoading();
                    }

                });


            }

        }

        var x = document.getElementById("demo");
        var options = {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        };

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                x.innerHTML = "Geolocation is not supported by this browser.";
            }
        }

        function showPosition(position) {
            $('#lat').val(position.coords.latitude);
            $('#lng').val(position.coords.longitude);
            $('#htmlLat').html(position.coords.latitude);
            $('#htmlLong').html(position.coords.longitude);
            console.log(position)


        }

        function showError(error) {
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    x.innerHTML = "User denied the request for Geolocation."
                    alert("Please Allow location service request to take collections.")
                    break;
                case error.POSITION_UNAVAILABLE:
                    x.innerHTML = "Location information is unavailable."
                    break;
                case error.TIMEOUT:
                    x.innerHTML = "The request to get user location timed out."
                    break;
                case error.UNKNOWN_ERROR:
                    x.innerHTML = "An unknown error occurred."
                    break;
            }
        }

        $(getLocation());
        navigator.permissions.query({name: 'geolocation'}).then(function (result) {
            console.log(result);
            {% comment %}       if (result.state === 'granted') {
                       $('#saveBtn').prop('disabled', false);
                   } else {
                       $('#saveBtn').prop('disabled', true);
                   }{% endcomment %}
            // Don't do anything if the permission was denied.
        });

        $(getCustomerList());


        function getCustomerList() {
            $.ajax({
                type: 'get',
                url: "{% url 'homeApp:list_party_api' %}",

                success: function (response) {

                    $('#party').html('');
                    $('#party').append(' <option value="">Search By Party Name</option>');

                     $('#TransferredParty').html('');
                    $('#TransferredParty').append(' <option value="">Search By Party Name</option>');
                    var j;
                    for (j = 0; j < response.data.length; j++) {

                        $('#party').append('<option value="' + response.data[j]['Detail'] + '" >' + response.data[j]['DisplayDetail'] + '</option>');
                        $('#TransferredParty').append('<option value="' + response.data[j]['Detail'] + '" >' + response.data[j]['DisplayDetail'] + '</option>');

                    }

                },

                error: function () {
                    $('body')
                        .toast({
                            class: 'error',
                            message: 'An error occurred !'
                        })
                    ;
                }
            });


        }

        const toIndianCurrency = () => {
            let num = $('#amountPaid').val();
            const curr = num.replace(/(\d)(?=(\d\d)+\d$)/g, "$1,")
            $('#money').html(curr);
        };

        function toggleOtp() {
            var enabled = $('#otpRequired').is(':checked');
            $('#otpBox').css('display', enabled ? '' : 'none');
            $('#otpVerified').val('0');
            $('#otpRequested').val('0');
            $('#otpCode').val('');
            $('#verifyOtpBtn').removeClass('green').removeClass('disabled').addClass('teal');
            $('#sendOtpBtn').removeClass('disabled');
            $('#otpCode').prop('disabled', false);
            $('#otpVerifiedBadge').hide();
            $('#editOtpBtn').hide();
            unlockFormAfterOtp();
            $('#otpStatus').hide();
        }

        function _dropdownRoot(selector) {
            var el = $(selector);
            if (!el.length) return $();
            if (el.hasClass('ui') && el.hasClass('dropdown')) return el;
            var wrap = el.closest('.ui.dropdown');
            if (wrap.length) return wrap;
            if (el.is('select')) {
                var parent = el.parent('.ui.dropdown');
                if (parent.length) return parent;
                var next = el.next('.ui.dropdown');
                if (next.length) return next;
                var prev = el.prev('.ui.dropdown');
                if (prev.length) return prev;
            }
            return $();
        }

        function lockDropdown(selector) {
            var el = $(selector);
            var root = _dropdownRoot(selector);
            try { el.prop('disabled', true); } catch (e) {}
            if (root.length) {
                root.addClass('disabled');
                try { root.dropdown('set disabled'); } catch (e2) {}
                try { root.find('input.search').prop('disabled', true); } catch (e3) {}
            }
        }
        function unlockDropdown(selector) {
            var el = $(selector);
            var root = _dropdownRoot(selector);
            try { el.prop('disabled', false); } catch (e) {}
            if (root.length) {
                root.removeClass('disabled');
                try { root.dropdown('set enabled'); } catch (e2) {}
                try { root.find('input.search').prop('disabled', false); } catch (e3) {}
            }
        }

        function lockFormAfterOtp() {
            // lock all entry fields once OTP is requested so details can't change
            lockDropdown('#party');
            lockDropdown('#paymentMode');
            try { $('#amountPaid').prop('disabled', true); } catch (e) {}
            try { $('#collectDate').prop('disabled', true); } catch (e) {}
            try { $('#remark').prop('disabled', true); } catch (e) {}
            lockDropdown('#bank');
            lockDropdown('#TransferredParty');
            try { $('#detail').prop('disabled', true); } catch (e) {}
            try { $('#chequeDate').prop('disabled', true); } catch (e) {}
            try { $('#otpRequired').prop('disabled', true); } catch (e) {}
            $('#editOtpBtn').show();

            // block submission until verified
            $('#saveBtn').addClass('disabled');
        }

        function unlockFormAfterOtp() {
            unlockDropdown('#party');
            unlockDropdown('#paymentMode');
            try { $('#amountPaid').prop('disabled', false); } catch (e) {}
            try { $('#collectDate').prop('disabled', false); } catch (e) {}
            try { $('#remark').prop('disabled', false); } catch (e) {}
            unlockDropdown('#bank');
            unlockDropdown('#TransferredParty');
            try { $('#detail').prop('disabled', false); } catch (e) {}
            try { $('#chequeDate').prop('disabled', false); } catch (e) {}
            try { $('#otpRequired').prop('disabled', false); } catch (e) {}
            $('#saveBtn').removeClass('disabled');
        }

        function editOtpDetails() {
            var party = $('#party').val();
            if (!party) {
                // If party got cleared somehow, just unlock locally.
                $('#otpRequested').val('0');
                $('#otpVerified').val('0');
                unlockFormAfterOtp();
                toggleOtp();
                return;
            }
            $('#editOtpBtn').addClass('loading disabled');
            $.ajax({
                type: 'post',
                url: '{% url "homeApp:clear_collection_otp_api" %}',
                dataType: 'json',
                data: { party: party },
                success: function (response) {
                    if (response && response.message === 'success') {
                        setOtpStatus('info', 'OTP cleared. You can edit details now.');
                    }
                },
                complete: function () {
                    $('#otpRequested').val('0');
                    $('#otpVerified').val('0');
                    $('#otpCode').val('').prop('disabled', false);
                    $('#otpVerifiedBadge').hide();
                    $('#sendOtpBtn').removeClass('disabled');
                    $('#verifyOtpBtn').removeClass('green disabled').addClass('teal');
                    $('#editOtpBtn').removeClass('loading disabled').hide();
                    unlockFormAfterOtp();
                }
            });
        }

        function setOtpStatus(type, message) {
            var box = $('#otpStatus');
            box.removeClass('positive negative info warning');
            if (type === 'success') box.addClass('positive');
            else if (type === 'error') box.addClass('negative');
            else if (type === 'warn') box.addClass('warning');
            else box.addClass('info');
            box.html(message);
            box.show();
        }

        function sendOtp() {
            var party = $('#party').val();
            var paymentMode = $('#paymentMode').val();
            var amountPaid = $('#amountPaid').val();
            var collectDate = $('#collectDate').val();
            if (!party) {
                setOtpStatus('warn', 'Select Party first.');
                return;
            }
            if (!paymentMode || !amountPaid || !collectDate) {
                setOtpStatus('warn', 'Fill Mode, Amount, and Collection Date before generating OTP.');
                return;
            }
            $('#sendOtpBtn').addClass('loading disabled');
            $('#otpVerified').val('0');
            $('#otpRequested').val('0');
            $('#verifyOtpBtn').removeClass('green');
            $.ajax({
                type: 'post',
                url: '{% url "homeApp:request_collection_otp_api" %}',
                dataType: 'json',
                data: { party: party, paymentMode: paymentMode, amountPaid: amountPaid, collectDate: collectDate },
                success: function (response) {
                    if (response.message === 'success') {
                        setOtpStatus('info', 'OTP generated. Ask customer to check OTP on their Ledger screen (valid 5 minutes).');
                        $('#otpCode').focus();
                        $('#otpRequested').val('1');
                        lockFormAfterOtp();
                    } else {
                        setOtpStatus('error', (response && response.error) ? response.error : 'Unable to generate OTP.');
                    }
                },
                error: function (xhr) {
                    var msg = 'Unable to generate OTP.';
                    if (xhr && xhr.status) msg += ' (HTTP ' + xhr.status + ')';
                    // Common: session timeout -> HTML response
                    if (xhr && xhr.status === 200) msg += ' (unexpected response)';
                    setOtpStatus('error', msg);
                },
                complete: function () {
                    setTimeout(function () {
                        $('#sendOtpBtn').removeClass('loading disabled');
                    }, 1200);
                }
            });
        }

        function verifyOtp() {
            var party = $('#party').val();
            var otp = ($('#otpCode').val() || '').trim();
            if (!party) {
                setOtpStatus('warn', 'Select Party first.');
                return;
            }
            if (!(otp.length === 6 && /^[0-9]{6}$/.test(otp))) {
                setOtpStatus('warn', 'Enter 6 digit OTP.');
                return;
            }
            $('#verifyOtpBtn').addClass('loading disabled');
            $.ajax({
                type: 'post',
                url: '{% url "homeApp:verify_collection_otp_api" %}',
                dataType: 'json',
                data: { party: party, otp: otp },
                success: function (response) {
                    if (response.message === 'success') {
                        $('#otpVerified').val('1');
                        $('#verifyOtpBtn').removeClass('teal').addClass('green').addClass('disabled');
                        $('#sendOtpBtn').addClass('disabled');
                        $('#otpCode').prop('disabled', true);
                        $('#otpVerifiedBadge').show();
                        $('#saveBtn').removeClass('disabled');
                        setOtpStatus('success', 'OTP verified.');
                    } else {
                        $('#otpVerified').val('0');
                        $('#saveBtn').addClass('disabled');
                        setOtpStatus('error', 'Invalid OTP.');
                    }
                },
                error: function (xhr) {
                    var msg = 'Unable to verify OTP.';
                    if (xhr && xhr.status) msg += ' (HTTP ' + xhr.status + ')';
                    setOtpStatus('error', msg);
                },
                complete: function () {
                    $('#verifyOtpBtn').removeClass('loading disabled');
                }
            });
        }

        var otpTypingTimer = null;
        function autoVerifyOtp() {
            clearTimeout(otpTypingTimer);
            var otp = ($('#otpCode').val() || '').trim();
            if (otp.length !== 6) return;
            otpTypingTimer = setTimeout(function () { verifyOtp(); }, 300);
        }
    </script>
{% endblock %}
