<div class="customer-otp-stack">
    <div id="custOtpPill" class="customer-otp-banner" style="display:none;">
        <div class="customer-otp-main">
            <div class="customer-otp-title">
                <i class="key icon" id="custOtpIcon"></i>
                <span id="custOtpTitle">Payment OTP</span>
            </div>
            <div class="customer-otp-code" id="custOtpCode">------</div>
            <div class="customer-otp-sub" id="custOtpSub" style="display:none;"></div>
        </div>
        <div class="customer-otp-side">
            <div class="customer-otp-timer" id="custOtpTimer">0:00</div>
            <div class="customer-otp-chips">
                <span class="customer-otp-chip" id="custOtpAmt" style="display:none;"><i class="money bill alternate outline icon"></i><span></span></span>
                <span class="customer-otp-chip" id="custOtpMode" style="display:none;"><i class="credit card outline icon"></i><span></span></span>
                <span class="customer-otp-chip" id="custOtpDate" style="display:none;"><i class="calendar alternate outline icon"></i><span></span></span>
            </div>
        </div>
    </div>

    <div id="custDeliveryOtpPill" class="customer-otp-banner" style="display:none;">
        <div class="customer-otp-main">
            <div class="customer-otp-title">
                <i class="key icon" id="custDeliveryOtpIcon"></i>
                <span id="custDeliveryOtpTitle">Delivery OTP</span>
            </div>
            <div class="customer-otp-code" id="custDeliveryOtpCode">------</div>
            <div class="customer-otp-sub" id="custDeliveryOtpSub" style="display:none;"></div>
        </div>
        <div class="customer-otp-side">
            <div class="customer-otp-timer" id="custDeliveryOtpTimer">0:00</div>
            <div class="customer-otp-chips">
                <span class="customer-otp-chip" id="custDeliveryOtpOrder" style="display:none;"><i class="file alternate outline icon"></i><span></span></span>
                <span class="customer-otp-chip" id="custDeliveryOtpVerifiedOn" style="display:none;"><i class="calendar alternate outline icon"></i><span></span></span>
            </div>
        </div>
    </div>
</div>
