{% if sidebar_sections %}
    {% for section in sidebar_sections %}
        {% if section.items %}
            <div class="nav-section item{% if section.collapsed_by_default %} is-collapsed{% endif %}{% if section.tone == 'muted' %} nav-section-muted{% endif %}{% if section.group_break_after %} nav-section-group-break{% endif %}">
                <button class="nav-section-header" type="button" aria-expanded="{% if section.collapsed_by_default %}false{% else %}true{% endif %}">
                    <span class="nav-section-title-wrap">
                        <span class="nav-section-title">{{ section.title }}</span>
                    </span>
                    <span class="nav-section-chevron"><i class="chevron down icon"></i></span>
                </button>
                <div class="menu nav-section-menu">
                    {% for item in section.items %}
                        <a class="item nav-link" href="{{ item.url }}">
                            <span class="nav-link-icon"><i class="{{ item.icon }} icon"></i></span>
                            <span class="nav-link-label">{{ item.label }}</span>
                        </a>
                    {% endfor %}
                </div>
            </div>
        {% endif %}
    {% endfor %}
{% endif %}

<div class="sidebar-meta">
    <div class="sidebar-meta-brand">zivaBooks</div>
    <div class="sidebar-meta-copy">Developed by Ziva Infotech</div>
    <div class="sidebar-meta-version">v 2.0.1</div>
    </div>
