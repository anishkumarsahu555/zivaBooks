# ==============================================================================
# /opt/apps/proxy/conf.d/default.conf
# ==============================================================================
# Default Catch-All Server Block & ACME Challenge Webroot
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Drop connections for unmatched hostnames / IP scanning
    location / {
        return 444;
    }
}
