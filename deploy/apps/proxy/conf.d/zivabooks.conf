# ==============================================================================
# /opt/apps/proxy/conf.d/zivabooks.conf
# ==============================================================================
# Virtual Host Configuration for zivaBooks
# Proxy Target: http://zivabooks_web:8000
# SSL Certificates: /opt/data/proxy/certs/live/app.yourdomain.com/
# ==============================================================================

# 1. HTTP Server Block (ACME Challenge + HTTPS Redirect)
server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com; # Change to your actual production domain

    # Allow ACME Challenge for Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block (Production Reverse Proxy)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.yourdomain.com; # Change to your actual production domain

    # SSL Certificate Configuration (Mounted from /opt/data/proxy/certs/)
    ssl_certificate /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;

    # SSL Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Payload Constraints (Allows large attachments & PDF exports)
    client_max_body_size 50M;

    # High-Performance Direct Media Serving (Bypasses Python for Static Uploads)
    location /media/ {
        alias /var/www/zivabooks/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Reverse Proxy to zivaBooks Uvicorn ASGI Application
    location / {
        proxy_pass http://zivabooks_web:8000;
        proxy_http_version 1.1;

        # WebSocket / ASGI support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Timeouts for heavy PDF/report generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
