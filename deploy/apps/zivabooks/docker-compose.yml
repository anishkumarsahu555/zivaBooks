# ==============================================================================
# /opt/apps/zivabooks/docker-compose.yml
# ==============================================================================
# Persistent Volumes strictly mapped to /appData/zivabooks/
# Networks: Joined to 'proxy_network' for edge reverse proxy routing
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: zivabooks:latest
    container_name: zivabooks_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_ENGINE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5433
      - POSTGRES_DB=${POSTGRES_DB:-zivaBooks}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - USE_REDIS_CACHE=true
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MEDIA_ROOT=/app/media
    volumes:
      - /appData/zivabooks/media:/app/media
    networks:
      - zivabooks_internal
      - proxy_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  celery_worker:
    image: zivabooks:latest
    container_name: zivabooks_worker
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "zivaBooks", "worker", "-l", "info", "--concurrency=4"]
    env_file:
      - .env
    environment:
      - DATABASE_ENGINE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5433
      - POSTGRES_DB=${POSTGRES_DB:-zivaBooks}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - USE_REDIS_CACHE=true
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MEDIA_ROOT=/app/media
    volumes:
      - /appData/zivabooks/media:/app/media
    networks:
      - zivabooks_internal
    depends_on:
      web:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    image: zivabooks:latest
    container_name: zivabooks_beat
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "zivaBooks", "beat", "-l", "info"]
    env_file:
      - .env
    environment:
      - DATABASE_ENGINE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5433
      - POSTGRES_DB=${POSTGRES_DB:-zivaBooks}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - USE_REDIS_CACHE=true
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - zivabooks_internal
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: zivabooks_postgres
    restart: unless-stopped
    command: ["postgres", "-p", "5433"]
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zivaBooks}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /appData/zivabooks/postgres:/var/lib/postgresql/data
    networks:
      - zivabooks_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5433 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zivaBooks}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zivabooks_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /appData/zivabooks/redis:/data
    networks:
      - zivabooks_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  zivabooks_internal:
    driver: bridge
  proxy_network:
    external: true
