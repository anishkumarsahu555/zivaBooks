# HTTP bootstrap. Certbot --nginx adds TLS and the HTTPS redirect after issuance.
# If this domain already exists in Nginx, merge into its existing server block.
server {
    listen 80;
    listen [::]:80;
    server_name zivainfotech.tech;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace untrusted client-provided forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
