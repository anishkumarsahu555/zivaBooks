<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12324a">
    <title>zivaBooks Offline</title>
    <style>
        :root {
            --bg-a: #091a2b;
            --bg-b: #12324a;
            --bg-c: #0f766e;
            --card: rgba(255, 255, 255, 0.12);
            --card-line: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
            --muted: rgba(226, 232, 240, 0.78);
            --accent: #2dd4bf;
            --accent-2: #38bdf8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: var(--text);
            font-family: "Avenir Next", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(248, 250, 252, 0.18), transparent 28%),
                radial-gradient(circle at left center, rgba(56, 189, 248, 0.18), transparent 26%),
                linear-gradient(145deg, var(--bg-a), var(--bg-b) 54%, var(--bg-c));
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(10px);
            opacity: 0.55;
            pointer-events: none;
        }

        body::before {
            width: 320px;
            height: 320px;
            top: -90px;
            right: -80px;
            background: rgba(255, 255, 255, 0.14);
        }

        body::after {
            width: 280px;
            height: 280px;
            bottom: -100px;
            left: -60px;
            background: rgba(45, 212, 191, 0.18);
        }

        .shell {
            width: min(92vw, 460px);
            padding: 28px;
            border-radius: 32px;
            background: var(--card);
            border: 1px solid var(--card-line);
            box-shadow: 0 30px 80px rgba(2, 6, 23, 0.34);
            backdrop-filter: blur(12px);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.10);
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f97316;
            box-shadow: 0 0 0 8px rgba(249, 115, 22, 0.15);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
        }

        .brand-mark {
            width: 84px;
            height: 84px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.12);
            display: grid;
            place-items: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
        }

        .brand-mark img {
            width: 56px;
            height: 56px;
            animation: float 1.6s ease-in-out infinite;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3rem);
            line-height: 0.95;
            letter-spacing: -0.05em;
        }

        p {
            margin: 16px 0 0;
            color: var(--muted);
            line-height: 1.7;
            font-size: 0.98rem;
        }

        .meter {
            margin-top: 22px;
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
        }

        .meter::before {
            content: "";
            display: block;
            width: 42%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            animation: slide 1.15s ease-in-out infinite;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .button {
            appearance: none;
            border: 0;
            cursor: pointer;
            border-radius: 16px;
            min-height: 48px;
            padding: 0 18px;
            font-weight: 800;
            font-size: 0.95rem;
        }

        .button-primary {
            color: #0b1624;
            background: linear-gradient(135deg, #99f6e4, #7dd3fc);
        }

        .button-secondary {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .status {
            margin-top: 18px;
            font-size: 0.92rem;
            font-weight: 700;
            color: rgba(226, 232, 240, 0.86);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes slide {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
        }
    </style>
</head>
<body>
    <main class="shell">
        <div class="badge">
            <span class="dot" aria-hidden="true"></span>
            Offline Mode
        </div>

        <div class="brand">
            <div class="brand-mark">
                <img src="/static/sw/images/icon-192.png" alt="zivaBooks logo">
            </div>
            <div>
                <h1>Still with you.</h1>
                <p>zivaBooks cannot reach the network right now. We will reopen the app automatically as soon as your connection is back.</p>
            </div>
        </div>

        <div class="meter" aria-hidden="true"></div>

        <div class="actions">
            <button class="button button-primary" id="retryBtn" type="button">Try Again</button>
            <button class="button button-secondary" id="homeBtn" type="button">Go Home</button>
        </div>

        <div class="status" id="statusText">Waiting for internet connection...</div>
    </main>

    <script>
        (function () {
            var statusText = document.getElementById('statusText');

            function updateStatus(message) {
                statusText.textContent = message;
            }

            function reopenApp() {
                updateStatus('Connection restored. Reopening zivaBooks...');
                window.location.replace('/home/');
            }

            function checkConnection() {
                updateStatus('Checking connection...');
                return fetch('/manifest.json?online-check=' + Date.now(), {
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache' }
                }).then(function (response) {
                    if (response.ok) {
                        reopenApp();
                        return true;
                    }
                    throw new Error('offline');
                }).catch(function () {
                    updateStatus('Still offline. We will keep checking automatically...');
                    return false;
                });
            }

            document.getElementById('retryBtn').addEventListener('click', checkConnection);
            document.getElementById('homeBtn').addEventListener('click', function () {
                window.location.replace('/home/');
            });

            window.addEventListener('online', checkConnection);
            window.addEventListener('offline', function () {
                updateStatus('Internet lost again. Waiting for connection...');
            });

            setInterval(checkConnection, 5000);
            checkConnection();
        })();
    </script>
</body>
</html>
