# Local development stack. Run: docker compose up --build -d
x-app: &app
  init: true
  build:
    context: .
    target: development
  environment:
    DEBUG: "true"
    SECRET_KEY: ${SECRET_KEY:-zivabooks-docker-local-dev-insecure-key}
    ALLOWED_HOSTS: localhost,127.0.0.1,[::1],web
    DATABASE_ENGINE: postgres
    POSTGRES_DB: ${POSTGRES_DB:-zivaBooks}
    POSTGRES_USER: ${POSTGRES_USER:-zivabooks}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zivabooks-local-password}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    USE_REDIS_CACHE: "true"
    REDIS_CACHE_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  volumes:
    - ${LOCAL_DATA_ROOT:-./local-data}/${APP_NAME:-zivabooks}/media:/app/media

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zivaBooks}
      POSTGRES_USER: ${POSTGRES_USER:-zivabooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zivabooks-local-password}
    volumes:
      - ${LOCAL_DATA_ROOT:-./local-data}/${APP_NAME:-zivabooks}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${LOCAL_DATA_ROOT:-./local-data}/${APP_NAME:-zivabooks}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    command:
      - /bin/sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec python manage.py runserver 0.0.0.0:8000 --noreload
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 60s

  worker:
    <<: *app
    command: ["celery", "-A", "zivaBooks", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      web:
        condition: service_healthy

