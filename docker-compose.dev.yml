# Local development compose override: exposes Postgres and Redis ports to localhost.
# Used for local dev without building web/worker Docker images.
services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
