# ==============================================================================
# zivaBooks — Production Stack (Hostinger Docker Manager & VPS)
# ==============================================================================
# Fully Self-Contained Compose: Web + Celery + DB + Redis + Nginx + Certbot SSL
# Requires ZERO external files on the host filesystem.
# ==============================================================================

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: zivabooks:latest
    container_name: zivabooks_migrate
    restart: "no"
    command: ["uv", "run", "python", "manage.py", "migrate", "--noinput"]
    environment:
      - DEBUG=false
      - DATABASE_ENGINE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5433
      - POSTGRES_DB=${POSTGRES_DB:-zivaBooks}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-secret-key-change-me}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zivabooks_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: zivabooks:latest
    container_name: zivabooks_web
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "zivaBooks.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--limit-concurrency", "1000", "--backlog", "2048"]
    environment:
      - DEBUG=false
      - SKIP_MIGRATIONS=true
      - DATABASE_ENGINE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5433
      - POSTGRES_DB=${POSTGRES_DB:-zivaBooks}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - USE_REDIS_CACHE=true
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MEDIA_ROOT=/app/media
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-secret-key-change-me}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://localhost}
    volumes:
      - media_data:/app/media
    ports:
      - "127.0.0.1:${PORT:-8001}:8000"
    networks:
      - zivabooks_network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: zivabooks:latest
    container_name: zivabooks_worker
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "zivaBooks", "worker", "-l", "info", "--concurrency=2", "--max-tasks-per-child=500", "--max-memory-per-child=150000"]
    environment:
      - DEBUG=false
      - DATABASE_ENGINE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5433
      - POSTGRES_DB=${POSTGRES_DB:-zivaBooks}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - USE_REDIS_CACHE=true
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MEDIA_ROOT=/app/media
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-secret-key-change-me}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    volumes:
      - media_data:/app/media
    networks:
      - zivabooks_network
    depends_on:
      web:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: zivabooks:latest
    container_name: zivabooks_beat
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "zivaBooks", "beat", "-l", "info"]
    environment:
      - DEBUG=false
      - DATABASE_ENGINE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5433
      - POSTGRES_DB=${POSTGRES_DB:-zivaBooks}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - USE_REDIS_CACHE=true
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-secret-key-change-me}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    networks:
      - zivabooks_network
    depends_on:
      web:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: zivabooks_postgres
    restart: unless-stopped
    command: ["postgres", "-p", "5433", "-c", "max_connections=300", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zivaBooks}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zivabooks_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5433 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zivaBooks}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zivabooks_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - zivabooks_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  zivabooks_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_data:
